services:
  author-api-republish-mock:
    build: ./
    ports:
      - 8081:8081
    environment:
      - CIR_HOST=http://api-cir:3030
    restart: on-failure
    networks:
      - eq-cir-fastapi_default
    container_name: author-api-republish-mock

networks:
  eq-cir-fastapi_default:
    external: true